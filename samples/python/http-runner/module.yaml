name: http-runner
ecosystem: python
version: 0.1.1
summary: Serve an http.server handler, answering GET /healthz for it, with graceful SIGINT/SIGTERM shutdown.
replaces:
  - HTTPServer or ThreadingHTTPServer setup and serve_forever
  - graceful shutdown on SIGINT and SIGTERM
  - a /healthz endpoint or health route in your handler
install: pip install "http-runner @ git+ssh://git@repo.billbert.co/artifactory/http-runner.git@v0.1.1"
setup: []
entry:
  - http_runner.run
liveness: "[http-runner] live"
docs: README.md
example: example/main.py
test: uv run --isolated --no-project --with . --with pytest pytest -q -p no:cacheprovider
