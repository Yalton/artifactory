name: httpserver
ecosystem: go
version: 0.1.0
summary: Run an http.Handler with GET /healthz and graceful shutdown on signal or cancel.
replaces:
  - http.ListenAndServe and http.Server setup
  - graceful shutdown on SIGINT and SIGTERM
  - a /healthz endpoint
install: go get repo.billbert.co/artifactory/httpserver
setup: []
entry:
  - httpserver.Run
  - httpserver.WithHealthCheck
liveness: go list -deps of the main package includes repo.billbert.co/artifactory/httpserver
docs: README.md
example: example/main.go
test: go test ./...
