name: DebugLogKit
ecosystem: godot-csharp
version: 0.1.0
summary: "Per-module debug logging that can be toggled on and off and is saved between runs."
replaces:
  - "a debug print wrapper with on/off switches per system"
  - "saving which debug channels are enabled"
install: "git submodule add git@repo.billbert.co:artifactory/DebugLogKit.git addons/DebugLogKit"
setup:
  - "project.godot [autoload]: DebugLogger=\"*res://addons/DebugLogKit/DebugLogger.cs\""
entry:
  - "DebugLogger.Instance"
  - "DebugLogger.RegisterModule"
  - "DebugLogger.Debug"
liveness: "[DebugLogKit] live"
docs: README.md
example: README.md#wiring
test: "godot --headless --path ../DebugLogKit.demo -- --smoke"
